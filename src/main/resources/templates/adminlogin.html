<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | Taxi Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border-radius: 1rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4 bg-white">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Login to Taxi Booking</h3>

                        <!-- Error Message -->
                        <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
                            Invalid credentials. Please try again.
                        </div>

                        <!-- Logout Message -->
                        <div th:if="${param.logout}" class="alert alert-success text-center" role="alert">
                            You have been successfully logged out.
                        </div>

                        <!-- Login Form -->
                        <form action="/login" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">UserName</label>
                                <input name="username" id="username" type="text" class="form-control" placeholder="Enter your username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input name="password" id="password" type="password" class="form-control" placeholder="Enter your password" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Login</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
