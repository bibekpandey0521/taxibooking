<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Service Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: #fff;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

	<div class="form-container">
	    <h2>Submit Service</h2>
		<h3 th:text="${msg}"></h3>
	    
	    <form action="addService" method="post" enctype="multipart/form-data">
	        
	        <div class="form-group">
	            <label for="service-image">Service Image:</label>
	            <input type="file" id="service-image" name="image" accept="image/*">
	        </div>
	
	        <div class="form-group">
	            <label for="service-title">Service Title:</label>
	            <input type="text" id="service-title" name="title" placeholder="Enter title">
	        </div>
	
	        <div class="form-group">
	            <label for="service-description">Service Description:</label>
	            <textarea id="service-description" name="description" placeholder="Enter description"></textarea>
	        </div>
	
	        <div class="form-group">
	            <button type="submit">Submit</button>
	        </div>
	
	    </form>
	</div>
</body>
</html>
