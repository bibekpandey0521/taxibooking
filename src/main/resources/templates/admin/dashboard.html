<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .sidebar {
            width: 250px;
            background-color: #212529;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }
        .sidebar .sidebar-header {
            font-size: 1.7rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid #444;
            padding-bottom: 15px;
        }
        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            transition: background 0.3s ease;
        }
        .sidebar a:hover {
            background-color: #343a40;
            color: #fff;
        }
        .sidebar a i {
            margin-right: 10px;
        }
        .main-content {
            flex-grow: 1;
            background-color: #f1f3f5;
            padding: 40px;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1055;
        }
    </style>
</head>
<body>

    <!-- Toast Message -->
    <div th:if="${message}" class="toast-container">
        <div class="toast align-items-center text-bg-info border-0 show" role="alert" aria-live="assertive" aria-atomic="true" id="messageToast">
            <div class="d-flex">
                <div class="toast-body" th:text="${message}">
                    Message here
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">Admin Panel</div>
        <a href="readAllBookings"><i class="bi bi-journal-text"></i> Read All Bookings</a>
        <a href="readAllContacts"><i class="bi bi-people-fill"></i> Read All Contacts</a>
        <a href="changeCredentials"><i class="bi bi-key-fill"></i> Change Credentials</a>
        <a href="addService"><i class="bi bi-key-fill"></i> Add Service</a>
        <a href="/dologout"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1 class="mb-4">Welcome to the Admin Dashboard</h1>
        <p class="lead">Use the sidebar to manage contacts, bookings, and credentials.</p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Auto-dismiss Toast -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const toastEl = document.getElementById('messageToast');
            if (toastEl) {
                const toast = new bootstrap.Toast(toastEl);
                toast.show();
                setTimeout(() => toast.hide(), 3000); // 3 seconds
            }
        });
    </script>
</body>
</html>
