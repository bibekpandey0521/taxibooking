<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 250px;
            background-color: #343a40;
            color: #fff;
            flex-shrink: 0;
        }
        .sidebar a {
            color: #ccc;
            text-decoration: none;
            display: block;
            padding: 15px;
        }
        .sidebar a:hover {
            background-color: #495057;
            color: #fff;
        }
        .main-content {
            flex-grow: 1;
            padding: 30px;
            background-color: #f8f9fa;
        }
        .sidebar-header {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #495057;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            Admin Panel
        </div>
        <a href="readAllContacts">Read All Contacts</a>
        <a href="#">Read All Bookings</a>
        <a href="/dologout">Logout</a>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <h1 class="mb-4">Welcome to the Admin Dashboard</h1>
        <p>Use the sidebar to manage contacts, bookings, and logout.</p>
    </div>

    <!-- Optional JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
