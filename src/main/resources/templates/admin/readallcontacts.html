<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Read Contacts</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            border-radius: 1rem;
        }
        .btn-delete {
            color: #fff;
            background-color: #dc3545;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary">All Contact Messages</h2>
            <a href="dashboard" class="btn btn-outline-secondary">Back to Admin Home</a>
        </div>

        <!-- Flash Message -->
        <div th:if="${message}" class="alert alert-success text-center" th:text="${message}"></div>

        <!-- Contact Table Card -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Message</th>
                                <th>Phone</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="contact : ${allcontacts}">
                                <td th:text="${contact.id}"></td>
                                <td th:text="${contact.name}"></td>
                                <td th:text="${contact.email}"></td>
                                <td th:text="${contact.message}"></td>
                                <td th:text="${contact.phone}"></td>
                                <td>
                                    <a th:href="@{/admin/deleteContact/{id}(id=${contact.id})}" class="btn btn-delete">Delete</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(allcontacts)}">
                                <td colspan="6" class="text-muted">No contacts found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
