<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Credentials</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Feedback message -->

<div class="container d-flex justify-content-center align-items-center min-vh-100 px-3">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h4 class="text-center mb-4">Change Credentials</h4>
        <form action="changeCredentials" method="post">
            <div class="mb-3">
                <label for="oldusername" class="form-label">Old UserName</label>
                <input type="text" class="form-control" id="oldusername" name="oldusername" placeholder="Enter old username" required>
            </div>
            <div class="mb-3">
                <label for="oldpassword" class="form-label">Old Password</label>
                <input type="password" class="form-control" id="oldpassword" name="oldpassword" placeholder="Enter old password" required>
            </div>
            <div class="mb-3">
                <label for="newusername" class="form-label">New UserName</label>
                <input type="text" class="form-control" id="newusername" name="newusername" placeholder="Enter new username" required>
            </div>
            <div class="mb-3">
                <label for="newpassword" class="form-label">New Password</label>
                <input type="password" class="form-control" id="newpassword" name="newpassword" placeholder="Enter new password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Change</button>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap 5 JS (Optional for components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
